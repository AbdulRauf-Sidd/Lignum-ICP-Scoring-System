document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;\">\n                    <span style=\"{{ t.sectorStyle }}\">{{ t.sector }}<sc-if value=\"{{ t.hasSub }}\"><span style=\"opacity:0.72;font-weight:500;\">· {{ t.sub }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                    <span style=\"{{ t.sectorConfStyle }}\" title=\"Sector classification confidence (web research)\">SECTOR {{ t.sectorConf }}<\u002Fspan>\n                    <span style=\"{{ t.icpBadgeStyle }}\">ICP {{ t.icp }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:var(--ink-2);margin-top:8px;\">{{ t.revenue }} rev · {{ t.headcount }} staff · {{ t.hq }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:24px;flex:none;\">\n                  <div style=\"text-align:right;\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;\">Score<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:9px;\">\n                      <div style=\"width:70px;height:6px;border-radius:5px;background:var(--surface-3);overflow:hidden;\"><span style=\"{{ t.scoreBarStyle }}\"><\u002Fspan><\u002Fdiv>\n                      <span style=\"font-family:'Archivo';font-weight:700;font-size:17px;color:var(--ink);\">{{ t.score }}<\u002Fspan>\n                      <span style=\"{{ t.tierStyle }}\">{{ t.tier }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right;\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;\">Confidence<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:9px;\">\n                      <div style=\"width:56px;height:6px;border-radius:5px;background:var(--surface-3);overflow:hidden;\"><span style=\"{{ t.confBarStyle }}\"><\u002Fspan><\u002Fdiv>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink);\">{{ t.conf }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ t.hasFlags }}\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2);\">\n                  <sc-for list=\"{{ t.flags }}\" as=\"f\" hint-placeholder-count=\"2\">\n                    <span style=\"{{ f.chipStyle }}\" title=\"{{ f.detail }}\">\n                      <svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M6 1.5 11 10.5H1z\"><\u002Fpath><line x1=\"6\" y1=\"5\" x2=\"6\" y2=\"7.5\"><\u002Fline><circle cx=\"6\" cy=\"9\" r=\"0.4\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n                      {{ f.label }}\n                    <\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ t.editing }}\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1;\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);\">Proposed sector<\u002Fspan>\n                    <select value=\"{{ t.sector }}\" onchange=\"{{ t.onSector }}\" style=\"height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13px;\">\n                      <sc-for list=\"{{ t.sectorOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                    <\u002Fselect>\n                  <\u002Flabel>\n                  <sc-if value=\"{{ t.hasSubOptions }}\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;min-width:200px;flex:1;\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);\">Sub-sector<\u002Fspan>\n                    <select value=\"{{ t.sub }}\" onchange=\"{{ t.onSub }}\" style=\"height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13px;\">\n                      <sc-for list=\"{{ t.subOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                    <\u002Fselect>\n                  <\u002Flabel>\n                  <\u002Fsc-if>\n                  <label style=\"display:flex;flex-direction:column;gap:6px;min-width:260px;flex:1;\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);\">Assigned ICP<\u002Fspan>\n                    <select value=\"{{ t.icp }}\" onchange=\"{{ t.onIcp }}\" style=\"height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13px;\">\n                      <sc-for list=\"{{ t.icpOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                    <\u002Fselect>\n                  <\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex;align-items:center;gap:10px;margin-top:15px;\">\n                <button onclick=\"{{ t.approve }}\" style=\"display:flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;\">\n                  <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"2.5,7.5 6,11 11.5,3.5\"><\u002Fpolyline><\u002Fsvg>\n                  Approve\n                <\u002Fbutton>\n                <button onclick=\"{{ t.toggleEdit }}\" style=\"display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;\">\n                  <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M9.3 2.4 11.6 4.7 5 11.3l-3 .7.7-3z\"><\u002Fpath><\u002Fsvg>\n                  {{ t.editLabel }}\n                <\u002Fbutton>\n                <button onclick=\"{{ t.reject }}\" style=\"margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;\">\n                  <svg width=\"13\" height=\"13\" viewBox=\"0 0 13 13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"3\" y1=\"3\" x2=\"10\" y2=\"10\"><\u002Fline><line x1=\"10\" y1=\"3\" x2=\"3\" y2=\"10\"><\u002Fline><\u002Fsvg>\n                  Reject\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ DETAIL ============ -->\n      <sc-if value=\"{{ showDetail }}\">\n      <div style=\"padding:22px 26px 70px;max-width:1240px;\">\n        <button onclick=\"{{ goOverview      <\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:16px;margin-top:9px;flex-wrap:wrap;\">\n              <a href=\"{{ d.url }}\" target=\"_blank\" style=\"display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--brand-deep);text-decoration:none;\">{{ d.domain }}\n                <svg width=\"11\" height=\"11\" viewBox=\"0 0 11 11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"M4 2.5H2.5V8.5H8.5V7\"><\u002Fpath><polyline points=\"6,2.5 8.5,2.5 8.5,5\"><\u002Fpolyline><line x1=\"8.5\" y1=\"2.5\" x2=\"5\" y2=\"6\"><\u002Fline><\u002Fsvg>\n              <\u002Fa>\n              <span style=\"font-size:12.5px;color:var(--muted);\">{{ d.countryFlag }} {{ d.country }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);\">No. {{ d.number }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:var(--muted);\">{{ d.industry }}<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--good);\"><\u002Fspan>Enriched {{ d.enrichedAt }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <!-- gauge -->\n          <div style=\"display:flex;align-items:center;gap:22px;flex:none;\">\n            <div style=\"text-align:center;\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;\">Confidence<\u002Fdiv>\n              <div style=\"font-family:'Archivo';font-weight:700;font-size:21px;color:var(--ink);\">{{ d.confidence }}<\u002Fdiv>\n              <div style=\"width:64px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px;\"><span style=\"{{ d.confBarStyle }}\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;width:118px;height:118px;flex:none;\">\n              <svg width=\"118\" height=\"118\" viewBox=\"0 0 118 118\">\n                <circle cx=\"59\" cy=\"59\" r=\"50\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"9\"><\u002Fcircle>\n                <circle cx=\"59\" cy=\"59\" r=\"50\" fill=\"none\" stroke=\"{{ d.gaugeColor }}\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-dasharray=\"{{ d.gaugeDash }}\" stroke-dashoffset=\"{{ d.gaugeOffset }}\" transform=\"rotate(-90 59 59)\"><\u002Fcircle>\n              <\u002Fsvg>\n              <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;\">\n                <span style=\"font-family:'Archivo';font-weight:800;font-size:32px;color:var(--ink);line-height:1;\">{{ d.score }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:var(--muted);margin-top:3px;\">ICP SCORE<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- detail view toggle + actions -->\n        <div style=\"display:flex;align-items:center;gap:14px;margin:20px 0 16px;\">\n          <div style=\"display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;\">\n            <button onclick=\"{{ setDScorecard }}\" style=\"{{ dScorecardStyle }}\">Scorecard<\u002Fbutton>\n            <button onclick=\"{{ setDFull }}\" style=\"{{ dFullStyle }}\">Full record<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-left:auto;display:flex;gap:10px;\">\n            <button onclick=\"{{ rescore }}\" style=\"display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;\">\n              <svg width=\"13\" height=\"13\" viewBox=\"0 0 13 13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M11 6.5a4.5 4.5 0 1 1-1.3-3.2\"><\u002Fpath><polyline points=\"11,1.5 11,3.8 8.7,3.8\"><\u002Fpolyline><\u002Fsvg>\n              Re-score\n            <\u002Fbutton>\n            <button onclick=\"{{ exportOne }}\" style=\"height:36px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;\">Export<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- score breakdown -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;\">\n            <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0;\">Score breakdown<\u002Fh3>\n            <span style=\"font-size:12px;color:var(--muted);\">Weighted roll-up · blank fields skipped, not zeroed<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px;\">\n            <sc-for list=\"{{ d.cats }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:188px 1fr 64px;gap:18px;align-items:center;padding:13px 0;border-top:1px solid var(--line-2);\">\n                <div>\n                  <div style=\"display:flex;align-items:center;gap:9px;\">\n                    <span style=\"width:7px;height:18px;border-radius:2px;background:{{ c.color }};flex:none;\"><\u002Fspan>\n                    <span style=\"font-weight:600;font-size:14px;color:var(--ink);\">{{ c.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:3px;margin-left:16 =\"2.6\" height=\"3.5\"><\u002Frect><\u002Fsvg><\u002Fspan>\n              <div>\n                <div style=\"font-family:'Archivo';font-weight:700;font-size:15px;color:var(--ink);\">Delivery efficiency · from CRM<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--muted);margin-top:2px;\">Placement volume, time-to-fill, fill rate and margin — sourced from Loxo.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.06em;padding:5px 11px;border-radius:7px;background:var(--surface-2);color:var(--muted);\">NOT YET WIRED<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ ANALYTICS ============ -->\n      <sc-if value=\"{{ showAnalytics }}\">\n      <div style=\"padding:24px 26px 70px;max-width:1240px;\" data-screen-label=\"Analytics\">\n\n        <!-- controls -->\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;\">\n          <div style=\"display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;\">\n            <sc-for list=\"{{ anMetrics }}\" as=\"m\" hint-placeholder-count=\"3\"><button onclick=\"{{ m.onClick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px;\">\n            <sc-for list=\"{{ anPeriods }}\" as=\"p\" hint-placeholder-count=\"3\"><button onclick=\"{{ p.onClick }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <select value=\"{{ anUserVal }}\" onchange=\"{{ onAnUser }}\" style=\"{{ anUserFilterStyle }}\">\n            <sc-for list=\"{{ anUserOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fselect>\n          <span style=\"margin-left:auto;display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--good);\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--good);\"><\u002Fspan>Microsoft 365 connected<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- KPIs -->\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;\">\n          <sc-for list=\"{{ anKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div style=\"{{ k.cardStyle }}\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);\">{{ k.label }}<\u002Fdiv>\n              <div style=\"{{ k.valueStyle }}margin-top:8px;\">{{ k.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- trend chart -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;\">\n            <div>\n              <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0;\">{{ anMetricLabel }}<\u002Fh3>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;\">{{ anPeriodLabel }} · peak {{ anPeak }}/week<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n              <sc-for list=\"{{ anLegend }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <span style=\"display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);\"><span style=\"{{ l.swatchStyle }}\"><\u002Fspan>{{ l.name }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:flex-end;\">\n            <sc-for list=\"{{ anChart }}\" as=\"w\" hint-placeholder-count=\"8\">\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"height:200px;display:flex;flex-direction:column-reverse;border-radius:7px 7px 2px 2px;overflow:hidden;background:var(--surface-2);\">\n                  <sc-for list=\"{{ w.segs }}\" as=\"sg\" hint-placeholder-count=\"2\"><div style=\"{{ sg.style }}\" title=\"{{ sg.title }}\"><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:7px;white-space:nowrap;\">{{ w.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- by sector + leaderboard -->\n        <div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:start;\">\n          <div style=\"min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;\">\n            <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0 0 16px;\">Companies by sector<\u002Fh3>\n            <div style=\"display:flex;flex-direction:column;gap:14px;\">\n              <sc-for list=\"{{ anSectors }}\" as=\"sec\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid;grid-template-columns:150px 1fr 52px;gap:14px;align-items:center;\">\n                  <div style=\"display:flex;align-items:center;gap:8px;min-width:0;\"><span style=\"{{ sec.dotStyle }}\"><\u002Fspan><span style=\"font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ sec.name }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:9px;border-radius:5px;background:var(--line);overflow:hidden;\"><span style=\"{{ sec.barStyle }}\"><\u002Fspan><\u002Fdiv>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink);text-align:right;\">{{ sec.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;\">\n            <div style=\"padding:18px 22px 4px;\"><h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0;\">Per-user activity<\u002Fh3><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:26px 1fr 70px 90px 80px;gap:14px;padding:10px 16px 8px;\">\n              <span><\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);\">User<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);text-align:right;\">CSVs<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);text-align:right;\">Companies<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);text-align:right;\">Contacts<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ anLeaders }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"{{ r.rowStyle }}\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);\">{{ r.rank }}<\u002Fspan>\n                <div style=\"display:flex;align-items:center;gap:10px;min-width:0;\">\n                  <span style=\"{{ r.avatarStyle }}\">{{ r.initials }}<\u002Fspan>\n                  <div style=\"min-width:0;\"><div style=\"font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ r.name }}<\u002Fdiv><div style=\"font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ r.role }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-2);text-align:right;\">{{ r.csvs }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink);text-align:right;\">{{ r.companies }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-2);text-align:right;\">{{ r.contacts }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ USAGE ============ -->\n      <sc-if value=\"{{ showUsage }}\">\n      <div style=\"padding:24px 26px 70px;max-width:1100px;\">\n        <!-- totals -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px;\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;\">\n            <div>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);\">Total credits spent<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:12px;margin-top:6px;\">\n                <span style=\"font-family:'Archivo';font-weight:800;font-size:34px;letter-spacing:-0.02em;color:var(--ink);\">{{ usageTotal }}<\u002Fspan>\n                <span style=\"font-size:13px;color:var(--muted);\">credits across all activity<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ usagePriceSet }}\">\n              <div style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 13px;\">\n                <b style=\"font-weight:600;\">{{ usageIndicative }}<\u002Fb><span style=\"font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);\">Indicative<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:20px;\">\n            <sc-for list=\"{{ usageBreakdown }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:230px 1fr 52px;gap:16px;align-items:center;\">\n                <div style=\"display:flex;align-items:center;gap:9px;\">\n                  <span style=\"width:8px;height:8px;border-radius:2px;background:{{ b.color }};flex:none;\"><\u002Fspan>\n                  <span style=\"font-size:13px;color:var(--ink);font-weight:500;\">{{ b.label }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:9px;border-radius:5px;background:var(--line);overflow:hidden;\"><span style=\"{{ b.barStyle }}\"><\u002Fspan><\u002Fdiv>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);font-weight:600;text-align:right;\">{{ b.value }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--muted);margin-top:16px;\">Counted from this app's own redeem calls — not a provider balance.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- audit log -->\n        <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:14px;\">\n          <h3 style=\"font-family:'Archivo';font-weight:700;font-size:17px;color:var(--ink);margin:0;\">Activity log<\u002Fh3>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);\">{{ usageRunCount }} runs · newest first<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasUsage }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ usageLog }}\" as=\"e\" hint-placeholder-count=\"4\">\n            <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;\">\n              <div style=\"display:flex;align-items:center;gap:13px;padding:14px 16px;\">\n                <sc-if value=\"{{ e.isRun }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button onclick=\"{{ e.toggle }}\" style=\"{{ e.chevStyle }}\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 13 13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"{{ e.chevIconStyle }}\"><polyline points=\"4,3 8.5,6.5 4,10\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ e.isContacts }}\"><span style=\"width:24px;height:24px;flex:none;border-radius:7px;background:var(--brand-tint);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"7\" cy=\"4.5\" r=\"2.5\"><\u002Fcircle><path d=\"M2.5 12 C2.5 9 4.5 8 7 8 C9.5 8 11.5 9 11.5 12\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsc-if>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-size:14px;font-weight:600;color:var(--ink);\">{{ e.title }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--ink-2);margin-top:2px;\">{{ e.metaLine }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right;flex:none;\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);font-weight:600;\">{{ e.credits }} cr<\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px;\">{{ e.date }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width:130px;flex:none;text-align:right;\">\n                  <div style=\"font-size:11px;color:var(--muted);\">run by<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:var(--ink-2);font-weight:500;\">{{ e.runBy }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <!-- run line items -->\n              <sc-if value=\"{{ e.expanded }}\">\n                <div style=\"border-top:1px solid var(--line-2);background:var(--surface-2);padding:6px 16px 10px 53px;\">\n                  <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1fr 96px;gap:12px;padding:8px 0;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);\">\n                    <span>Company<\u002Fspan><span>Creditsafe<\u002Fspan><span>Cognism<\u002Fspan><span>Result<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ e.lineItems }}\" as=\"li\" hint-placeholder-count=\"3\">\n                    <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1fr 96px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2);\">\n                      <span style=\"font-size:13px;color:var(--ink);font-weight:500;\">{{ li.name }}<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);\">{{ li.report }}<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);\">{{ li.cognism }}<\u002Fspan>\n                      <span style=\"{{ li.statusStyle }}\">{{ li.statusLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <!-- contact pull names -->\n              <sc-if value=\"{{ e.isContacts }}\">\n                <div style=\"border-top:1px solid var(--line-2);background:var(--surface-2);padding:9px 16px 11px 53px;font-size:12.5px;color:var(--ink-2);\">{{ e.names }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ CONFIG ============ -->\n      <sc-if value=\"{{ showConfig }}\">\n      <div style=\"padding:24px 26px 70px;max-width:980px;\">\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;gap:14px;\">\n          <span style=\"width:8px;height:38px;background:var(--brand);border-radius:2px;flex:none;\"><\u002Fspan>\n          <div>\n            <div style=\"font-size:13.5px;color:var(--ink);font-weight:600;\">The model is config, not code.<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--muted);margin-top:2px;\">A shared base is used by all four profiles. Weights and fit rules are set per ICP. Re-scoring uses stored data — no new spend.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== per-ICP layer ===== -->\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin:4px 2px 12px;\">Per-profile settings<\u002Fdiv>\n        <div class=\"lg-scroll\" style=\"display:flex;gap:10px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;\">\n          <sc-for list=\"{{ cfgTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\"><span style=\"{{ t.badgeStyle }}\">{{ t.letter }}<\u002Fspan>{{ t.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- weights (per ICP) -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px;\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;\">\n            <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0;\">Category weights · ICP {{ cfgIcpId }}<\u002Fh3>\n            <span style=\"{{ weightTotalStyle }}\">Total {{ weightTotal }} / 100<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:18px;\">{{ cfgIcpName }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px;\">\n            <sc-for list=\"{{ cfgWeights }}\" as=\"w\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:188px 1fr 52px;gap:18px;align-items:center;\">\n                <div style=\"display:flex;align-items:center;gap:9px;\">\n                  <span style=\"width:7px;height:16px;border-radius:2px;background:{{ w.color }};flex:none;\"><\u002Fspan>\n                  <span style=\"font-size:13.5px;color:var(--ink);font-weight:500;\">{{ w.label }}<\u002Fspan>\n                <\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"45\" value=\"{{ w.val }}\" onchange=\"{{ w.onInput }}\" oninput=\"{{ w.onInput }}\" style=\"width:100%;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink);font-weight:600;text-align:right;\">{{ w.valLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--muted);margin-top:16px;\">Data confidence is an indicator shown beside the score, never weighted into it.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- fit rules (per ICP) -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px;\">\n          <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0 0 4px;\">Fit rules · ICP {{ cfgIcpId }}<\u002Fh3>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:8px;\">These define the profile. A hard requirement that fails flags the company as a weak / wrong-ICP match and holds its score low.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;\">\n            <sc-for list=\"{{ cfgRules }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line-2);\">\n                <span style=\"font-size:13.5px;color:var(--ink);font-weight:500;flex:1;\">{{ r.label }}<\u002Fspan>\n                <span style=\"{{ r.tagStyle }}\">{{ r.tagLabel }}<\u002Fspan>\n                <button onclick=\"{{ r.onToggle }}\" style=\"{{ r.toggleStyle }}\"><span style=\"{{ r.knobStyle }}\"><\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== shared base ===== -->\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin:24px 2px 12px;\">Shared base · all profiles<\u002Fdiv>\n\n        <!-- categories & confidence -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px;\">\n          <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0 0 4px;\">Scoring categories &amp; confidence<\u002Fh3>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:16px;\">The categories every profile rolls up. Each profile weights them differently (above).<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px;\">\n            <sc-for list=\"{{ baseCategories }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <span style=\"display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 13px;\"><span style=\"width:8px;height:8px;border-radius:2px;background:{{ c.color }};\"><\u002Fspan>{{ c.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:10px;padding:13px 15px;background:var(--surface-2);border-radius:11px;border:1px solid var(--line-2);\">\n            <span style=\"width:8px;height:8px;border-radius:50%;background:var(--navy);flex:none;margin-top:5px;\"><\u002Fspan>\n            <div style=\"font-size:12.5px;color:var(--ink-2);\"><b style=\"color:var(--ink);\">Data-confidence rule.<\u002Fb> Confidence reflects how complete the captured data is. It is shown beside every score but is never weighted into it — a thin-data Tier A stays visible as low confidence. Blank fields are skipped, not zeroed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- thresholds -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px;\">\n          <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0 0 4px;\">Tier thresholds<\u002Fh3>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:18px;\">Total score maps to a tier. Shown with confidence so a thin-data Tier A is visible.<\u002Fdiv>\n          <div style=\"height:14px;border-radius:8px;overflow:hidden;display:flex;margin-bottom:16px;border:1px solid var(--line);\">\n            <span style=\"{{ bandCStyle }}\"><\u002Fspan><span style=\"{{ bandBStyle }}\"><\u002Fspan><span style=\"{{ bandAStyle }}\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:30px;\">\n            <div style=\"display:flex;align-items:center;gap:11px;\">\n              <span style=\"display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);font-weight:600;\"><span style=\"width:10px;height:10px;border-radius:3px;background:var(--good);\"><\u002Fspan>Tier A ≥<\u002Fspan>\n              <input type=\"number\" value=\"{{ thrA }}\" onchange=\"{{ onThrA }}\" style=\"width:64px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;text-align:center;\">\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:11px;\">\n              <span style=\"display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);font-weight:600;\"><span style=\"width:10px;height:10px;border-radius:3px;background:var(--brand);\"><\u002Fspan>Tier B ≥<\u002Fspan>\n              <input type=\"number\" value=\"{{ thrB }}\" onchange=\"{{ onThrB }}\" style=\"width:64px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;text-align:center;\">\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);\"><span style=\"width:10px;height:10px;border-radius:3px;background:var(--cool);\"><\u002Fspan>Tier C below {{ thrB }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- bands -->\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px;\">\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;\">Revenue band → score<\u002Fdiv>\n            <sc-for list=\"{{ revBands }}\" as=\"b\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-2);\">\n                <span style=\"font-size:13px;color:var(--ink-2);\">{{ b.label }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);font-weight:600;\">{{ b.score }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;\">Headcount band → score<\u002Fdiv>\n            <sc-for list=\"{{ headBands }}\" as=\"b\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-2);\">\n                <span style=\"font-size:13px;color:var(--ink-2);\">{{ b.label }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);font-weight:600;\">{{ b.score }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- contact rule + apply -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:18px;\">\n          <div style=\"flex:1;\">\n            <div style=\"font-size:13.5px;color:var(--ink);font-weight:600;\">Contact pull rule<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--muted);margin-top:2px;\">On demand keeps contact-credit spend to accounts the team actually opens.<\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ toggleContactRule }}\" style=\"{{ contactRuleStyle }}\"><span style=\"{{ contactKnobStyle }}\"><\u002Fspan><\u002Fbutton>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);width:96px;\">{{ contactRuleLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- enrichment run settings -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:16px;\">\n          <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0 0 4px;\">Enrichment run settings<\u002Fh3>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:18px;\">Used to estimate cost before an enrichment run, and to avoid re-pulling fresh records.<\u002Fdiv>\n          <div style=\"display:flex;gap:30px;flex-wrap:wrap;\">\n            <div style=\"display:flex;align-items:center;gap:11px;\">\n              <span style=\"font-size:13px;color:var(--ink);font-weight:600;\">Indicative price per credit<\u002Fspan>\n              <div style=\"display:flex;align-items:center;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);overflow:hidden;\">\n                <span style=\"padding:0 11px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);border-right:1px solid var(--line);height:100%;display:flex;align-items:center;\">£<\u002Fspan>\n                <input value=\"{{ csPrice }}\" oninput=\"{{ onCsPrice }}\" placeholder=\"0.00\" style=\"width:88px;height:100%;border:none;background:transparent;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;padding:0 11px;\">\n              <\u002Fdiv>\n              <span style=\"font-size:12px;color:var(--muted);\">leave blank to hide the £ figure<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:11px;\">\n              <span style=\"font-size:13px;color:var(--ink);font-weight:600;\">Re-pull after<\u002Fspan>\n              <input type=\"number\" value=\"{{ rePullDays }}\" onchange=\"{{ onRePull }}\" style=\"width:64px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;text-align:center;\">\n              <span style=\"font-size:13px;color:var(--ink-2);\">days<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- currency & FX -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:16px;\">\n          <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0 0 4px;\">Currency &amp; exchange rates<\u002Fh3>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:18px;\">All revenue is shown in US dollars. Source figures in other currencies are converted at these rates.<\u002Fdiv>\n          <div style=\"display:flex;gap:30px;flex-wrap:wrap;align-items:center;\">\n            <div style=\"display:flex;align-items:center;gap:11px;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);font-weight:600;\">£1 =<\u002Fspan>\n              <div style=\"display:flex;align-items:center;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);overflow:hidden;\">\n                <span style=\"padding:0 11px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);border-right:1px solid var(--line);height:100%;display:flex;align-items:center;\">$<\u002Fspan>\n                <input value=\"{{ fxGBP }}\" oninput=\"{{ onFxGBP }}\" style=\"width:72px;height:100%;border:none;background:transparent;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;padding:0 11px;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:11px;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);font-weight:600;\">€1 =<\u002Fspan>\n              <div style=\"display:flex;align-items:center;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);overflow:hidden;\">\n                <span style=\"padding:0 11px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--muted);border-right:1px solid var(--line);height:100%;display:flex;align-items:center;\">$<\u002Fspan>\n                <input value=\"{{ fxEUR }}\" oninput=\"{{ onFxEUR }}\" style=\"width:72px;height:100%;border:none;background:transparent;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;padding:0 11px;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;color:var(--muted);\">US-domiciled companies are already in USD.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- account health score -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:16px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;\">\n            <h3 style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);margin:0;\">Account health score<\u002Fh3>\n            <span style=\"{{ healthTotalStyle }}\">Total {{ healthTotal }}%<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:18px;\">How live-client health is weighted. Applied to the Accounts view. Adverse events subtract from the blended qualitative + talent score.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px;\">\n            <sc-for list=\"{{ healthWeights }}\" as=\"w\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:200px 1fr 52px;gap:16px;align-items:center;\">\n                <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:8px;height:18px;border-radius:2px;background:{{ w.color }};flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:var(--ink);font-weight:500;\">{{ w.label }}<\u002Fspan><\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"80\" value=\"{{ w.val }}\" oninput=\"{{ w.onInput }}\" style=\"width:100%;\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--ink);text-align:right;\">{{ w.valLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:11px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2);\">\n            <span style=\"font-size:13px;color:var(--ink);font-weight:600;\">Review reminder after<\u002Fspan>\n            <input type=\"number\" value=\"{{ healthReviewDays }}\" onchange=\"{{ onHealthReviewDays }}\" style=\"width:64px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:13px;font-family:'JetBrains Mono',monospace;text-align:center;\">\n            <span style=\"font-size:13px;color:var(--ink-2);\">days without a client-scorecard review<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:flex-end;gap:12px;margin-top:20px;\">\n          <button onclick=\"{{ resetConfig }}\" style=\"height:40px;padding:0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;\">Reset to defaults<\u002Fbutton>\n          <button onclick=\"{{ applyConfig }}\" style=\"height:40px;padding:0 22px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.12);\">Apply &amp; re-score all<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ NOTIFICATIONS ============ -->\n      <sc-if value=\"{{ showNotifications }}\">\n      <div style=\"padding:24px 26px 70px;max-width:1000px;\" data-screen-label=\"Notifications\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;\">\n          <sc-for list=\"{{ notifFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<span style=\"opacity:0.6;margin-left:6px;font-family:'JetBrains Mono',monospace;font-size:11px;\">{{ f.count }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n          <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);\">{{ notifTotalLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ notifEmpty }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px;\">\n            <div style=\"width:52px;height:52px;border-radius:14px;background:var(--good-tint);color:var(--good);display:flex;align-items:center;justify-content:center;\">\n              <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"4,12.5 10,18.5 20,6.5\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"font-family:'Archivo';font-weight:700;font-size:17px;color:var(--ink);\">All clear<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted);max-width:360px;\">{{ notifEmptyHint }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ notifItems }}\" as=\"n\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px;\">\n              <span style=\"{{ n.barStyle }}\"><\u002Fspan>\n              <span style=\"{{ n.dotStyle }}\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M8 1.5 15 14H1z\"><\u002Fpath><line x1=\"8\" y1=\"6\" x2=\"8\" y2=\"9.5\"><\u002Fline><circle cx=\"8\" cy=\"11.6\" r=\"0.5\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n              <\u002Fspan>\n              <div style=\"min-width:0;flex:1;\">\n                <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap;\">\n                  <span style=\"font-size:14px;font-weight:700;color:var(--ink);font-family:'Archivo';\">{{ n.title }}<\u002Fspan>\n                  <span style=\"{{ n.typeStyle }}\">{{ n.typeLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--ink-2);margin-top:3px;\">{{ n.detail }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);flex:none;white-space:nowrap;\">{{ n.time }}<\u002Fspan>\n              <button onclick=\"{{ n.go }}\" style=\"flex:none;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;\">{{ n.cta }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ IMPORT & QUEUE ============ -->\n      <sc-if value=\"{{ showImport }}\">\n      <div style=\"padding:24px 26px 70px;max-width:1180px;\">\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;\">\n          <!-- CSV card -->\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;\">\n            <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:4px;\">\n              <span style=\"width:30px;height:30px;border-radius:8px;background:var(--brand-tint);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;flex:none;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M11 14V4\"><\u002Fpath><polyline points=\"7,7.5 11,3.5 15,7.5\"><\u002Fpolyline><path d=\"M4 14v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <div style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);\">Upload a CSV<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:16px;\">Bulk add. Columns: company name, domain (domain required).<\u002Fdiv>\n            <sc-if value=\"{{ csvNoFile }}\" hint-placeholder-val=\"{{ true }}\">\n              <button onclick=\"{{ loadSampleCsv }}\" style=\"flex:1;min-height:188px;width:100%;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;\">\n                <span style=\"width:46px;height:46px;border-radius:12px;background:var(--brand-tint);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;\">\n                  <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M11 14V4\"><\u002Fpath><polyline points=\"7,7.5 11,3.5 15,7.5\"><\u002Fpolyline><path d=\"M4 14v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <span style=\"font-size:14px;color:var(--ink);font-weight:600;\">Drop a CSV or click to upload<\u002Fspan>\n                <span style=\"font-size:12px;color:var(--muted);\">company name, domain<\u002Fspan>\n                <span style=\"margin-top:2px;font-size:12px;color:var(--brand-deep);font-weight:600;font-family:'JetBrains Mono',monospace;\">▸ Use sample file<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ csvHasFile }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\">\n                <div style=\"display:flex;align-items:center;gap:10px;\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink);\">target_list.csv<\u002Fspan>\n                  <span style=\"font-size:12px;color:var(--good);\">{{ csvValidCount }} valid<\u002Fspan>\n                  <span style=\"font-size:12px;color:var(--danger);\">{{ csvInvalidCount }} need attention<\u002Fspan>\n                <\u002Fdiv>\n                <button onclick=\"{{ clearCsv }}\" style=\"font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;\">Clear<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;\">\n                <sc-for list=\"{{ csvRows }}\" as=\"cr\" hint-placeholder-count=\"6\">\n                  <div style=\"{{ cr.style }}\">\n                    <span style=\"{{ cr.dotStyle }}\"><\u002Fspan>\n                    <span style=\"font-size:13px;color:var(--ink);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ cr.name }}<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);\">{{ cr.domain }}<\u002Fspan>\n                    <span style=\"{{ cr.tagStyle }}\">{{ cr.tag }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button onclick=\"{{ submitCsv }}\" style=\"height:40px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.12);\">Add {{ csvTotalCount }} to queue<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- Manual card -->\n          <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;\">\n            <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:4px;\">\n              <span style=\"width:30px;height:30px;border-radius:8px;background:var(--navy-tint);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><line x1=\"8\" y1=\"3\" x2=\"8\" y2=\"13\"><\u002Fline><line x1=\"3\" y1=\"8\" x2=\"13\" y2=\"8\"><\u002Fline><\u002Fsvg>\n              <\u002Fspan>\n              <div style=\"font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);\">Add manually<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:16px;\">Single company. The pipeline resolves the rest.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px;\">\n              <div>\n                <label style=\"font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;\">Company name<\u002Flabel>\n                <input value=\"{{ manualName }}\" oninput=\"{{ onManualName }}\" placeholder=\"e.g. Severfield plc\" style=\"width:100%;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:14px;\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;\">Domain <span style=\"color:var(--danger);\">*<\u002Fspan><\u002Flabel>\n                <input value=\"{{ manualDomain }}\" oninput=\"{{ onManualDomain }}\" placeholder=\"e.g. severfield.com\" style=\"width:100%;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:14px;\">\n              <\u002Fdiv>\n              <button onclick=\"{{ addManualRow }}\" style=\"height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;\">+ Add to batch<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasStaged }}\">\n              <div style=\"margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;\">\n                <sc-for list=\"{{ stagedRows }}\" as=\"sr\" hint-placeholder-count=\"2\">\n                  <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 13px;border-top:1px solid var(--line-2);\">\n                    <span style=\"font-size:13px;color:var(--ink);font-weight:500;\">{{ sr.name }}<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);\">{{ sr.domain }}<\u002Fspan>\n                    <button onclick=\"{{ sr.remove }}\" style=\"width:24px;height:24px;border:none;border-radius:6px;background:var(--surface-3);color:var(--muted);cursor:pointer;\">×<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button onclick=\"{{ submitStaged }}\" style=\"margin-top:12px;height:40px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.12);\">Queue {{ stagedCount }} companies<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ICP selector for the batch -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:24px;\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:4px;\">\n            <h3 style=\"font-family:'Archivo';font-weight:700;font-size:17px;color:var(--ink);margin:0;\">Ideal customer profile for this batch<\u002Fh3>\n            <span style=\"{{ icpHintStyle }}\">{{ icpHintLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:16px;\">Every company in this run is scored for fit to the profile you choose. You can run separate batches for different profiles.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;\">\n            <sc-for list=\"{{ icpOptions }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ p.onClick }}\" style=\"{{ p.cardStyle }}\">\n                <span style=\"{{ p.badgeStyle }}\">{{ p.letter }}<\u002Fspan>\n                <span style=\"min-width:0;\">\n                  <span style=\"display:block;font-size:13.5px;font-weight:600;color:var(--ink);\">{{ p.name }}<\u002Fspan>\n                  <span style=\"display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.4;\">{{ p.short }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- review & run -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:24px;\">\n          <div style=\"display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;\">\n            <div>\n              <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;\">\n                <h3 style=\"font-family:'Archivo';font-weight:700;font-size:17px;color:var(--ink);margin:0;\">Review &amp; run<\u002Fh3>\n                <div style=\"display:flex;align-items:center;gap:8px;\">\n                  <span style=\"font-family:'Archivo';font-weight:800;font-size:24px;color:var(--ink);letter-spacing:-0.02em;\">{{ queuedTotal }}<\u002Fspan>\n                  <span style=\"font-size:13px;color:var(--muted);\">in the queue<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"{{ readyStatStyle }}\">{{ readyCount }} ready<\u002Fspan>\n                <span style=\"{{ skippedStatStyle }}\">{{ skippedCount }} skipped<\u002Fspan>\n                <span style=\"{{ attentionStatStyle }}\">{{ attentionCount }} need attention<\u002Fspan>\n              <\u002Fdiv>\n\n              <!-- invalid rows to fix/remove -->\n              <sc-if value=\"{{ hasInvalid }}\">\n                <div style=\"margin-top:16px;border:1px solid var(--danger);border-radius:12px;overflow:hidden;\">\n                  <div style=\"padding:9px 14px;background:var(--danger-tint);font-size:12px;font-weight:600;color:var(--danger);\">Fix the domain or remove these before running<\u002Fdiv>\n                  <sc-for list=\"{{ invalidRows }}\" as=\"iv\" hint-placeholder-count=\"1\">\n                    <div style=\"display:grid;grid-template-columns:minmax(120px,1fr) minmax(150px,1.2fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2);\">\n                      <div style=\"min-width:0;\">\n                        <div style=\"font-size:13px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ iv.name }}<\u002Fdiv>\n                        <div style=\"font-size:11px;color:var(--danger);\">{{ iv.reason }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <input value=\"{{ iv.domain }}\" oninput=\"{{ iv.onDomain }}\" placeholder=\"add a valid domain\" style=\"height:34px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12.5px;\">\n                      <button onclick=\"{{ iv.remove }}\" style=\"height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;\">Remove<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <!-- skipped: insufficient data -->\n              <sc-if value=\"{{ hasSkipped }}\">\n                <div style=\"margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;\">\n                  <div style=\"padding:9px 14px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2);\">Skipped — not enough data to score (won't be pulled)<\u002Fdiv>\n                  <sc-for list=\"{{ skippedRows }}\" as=\"sk\" hint-placeholder-count=\"1\">\n                    <div style=\"display:grid;grid-template-columns:minmax(120px,1fr) minmax(150px,1.2fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2);\">\n                      <div style=\"min-width:0;\">\n                        <div style=\"font-size:13px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ sk.name }}<\u002Fdiv>\n                        <div style=\"font-size:11px;color:var(--cool);\">{{ sk.reason }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ sk.domain }}<\u002Fdiv>\n                      <button onclick=\"{{ sk.remove }}\" style=\"height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;\">Remove<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <!-- pre-run summary -->\n              <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:9px;\">\n                <div style=\"display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);\">\n                  <span style=\"width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none;\"><\u002Fspan><b style=\"font-weight:600;\">{{ companiesLine }}<\u002Fb>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);\">\n                  <span style=\"width:6px;height:6px;border-radius:50%;background:var(--navy);flex:none;\"><\u002Fspan>{{ creditsafeLine }}\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);\">\n                  <span style=\"width:6px;height:6px;border-radius:50%;background:var(--brand-deep);flex:none;\"><\u002Fspan>{{ cognismLine }}\n                <\u002Fdiv>\n                <sc-if value=\"{{ icpChosen }}\">\n                  <div style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);\">\n                    <span style=\"width:6px;height:6px;border-radius:50%;background:var(--cool);flex:none;\"><\u002Fspan>Scored for fit to <b style=\"font-weight:600;color:var(--ink);\">ICP {{ icpName }}<\u002Fb>.\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);\">\n                  <span style=\"width:6px;height:6px;border-radius:50%;background:var(--good);flex:none;\"><\u002Fspan>{{ noContactsLine }}\n                <\u002Fdiv>\n                <sc-if value=\"{{ priceSet }}\">\n                  <div style=\"display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);margin-top:2px;padding-top:11px;border-top:1px dashed var(--line);\">\n                    <span style=\"width:6px;height:6px;border-radius:50%;background:var(--ink-2);flex:none;\"><\u002Fspan><b style=\"font-weight:600;\">{{ costLine }}<\u002Fb><span style=\"font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:2px 7px;border-radius:5px;\">Indicative<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- run button + progress -->\n            <div style=\"display:flex;flex-direction:column;align-items:stretch;gap:12px;min-width:230px;\">\n              <button onclick=\"{{ onRun }}\" style=\"{{ runBtnStyle }}\">\n                <sc-if value=\"{{ batchRunning }}\"><span class=\"lg-spin\" style=\"width:15px;height:15px;border-color:rgba(255,255,255,0.4);border-top-color:#fff;\"><\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ runReady }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"currentColor\"><polygon points=\"3,2 13,7.5 3,13\"><\u002Fpolygon><\u002Fsvg><\u002Fsc-if>\n                {{ runLabel }}\n              <\u002Fbutton>\n              <sc-if value=\"{{ hasRunBlock }}\">\n                <div style=\"display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);justify-content:center;text-align:center;\">\n                  <svg width=\"13\" height=\"13\" viewBox=\"0 0 13 13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"6.5\" cy=\"6.5\" r=\"5\"><\u002Fcircle><line x1=\"6.5\" y1=\"4\" x2=\"6.5\" y2=\"7\"><\u002Fline><circle cx=\"6.5\" cy=\"9\" r=\"0.6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n                  {{ runBlockedReason }}\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ showProgress }}\">\n                <div style=\"border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(-
