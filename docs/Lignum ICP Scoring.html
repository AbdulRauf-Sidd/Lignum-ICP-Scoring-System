ecast\",\"Data Centre Infrastructure\",\"Industrial Services\",\"Filtration\"];\n    const shares=[0.30,0.28,0.18,0.16,0.08];\n    const rnd=(seed)=>{ const x=Math.sin(seed*127.1+11.7)*43758.5453; return x-Math.floor(x); };\n    const end=new Date(2026,5,29); const weeks=[];\n    for(let w=11; w>=0; w--){\n      const d=new Date(end); d.setDate(d.getDate()-w*7);\n      const label=d.toLocaleDateString(\"en-GB\",{day:\"2-digit\",month:\"short\"});\n      const perUser={};\n      this.team.forEach((u,ui)=>{\n        const skill=[1,0.82,0.66,0.5][ui]||0.5;\n        const growth=1+(11-w)*0.045;\n        const noise=0.55+rnd(w*7+ui*13)*0.9;\n        const companies=Math.max(0,Math.round(9*skill*growth*noise));\n        const contacts=Math.round(companies*(1.3+rnd(w+ui+5)*1.3));\n        const csvs=Math.max(0,Math.round((companies/6)*(0.7+rnd(w+ui+9))));\n        const secs={}; let rem=companies;\n        sectors.forEach((sec,si)=>{ const v = si===sectors.length-1 ? rem : Math.round(companies*shares[si]*(0.7+rnd(w+ui+si*3)*0.7)); const val=Math.max(0,Math.min(rem,v)); secs[sec]=val; rem-=val; });\n        perUser[u.id]={csvs,companies,contacts,sectors:secs};\n      });\n      weeks.push({label,date:d,perUser});\n    }\n    return weeks;\n  }\n  currentUser(){ return this.team.find(u=>u.id===this.state.authUserId)||null; }\n  runByName(){ const u=this.currentUser(); return u?u.name:\"Unknown user\"; }\n  signInAs(id){ const u=this.team.find(x=>x.id===id); this.setState({authUserId:id, accountMenu:false, runBy:u?u.name:\"Unknown\"}); if(u) this.toastMsg(\"Signed in as \"+u.name); }\n  signOut(){ this.setState({authUserId:null, accountMenu:false}); }\n\n  // ---- Accounts (client lifecycle) ----\n  clientScoreVals(c){ return this.state.clientScores[c.id] || {relationship:3,delivery:3,growth:3,payment:3,strategic:3}; }\n  talentVals(c){ return this.state.talent[c.id] || {headcountChange:0,attrition:12,tenure:5}; }\n  daysSince(dateStr){ const t=new Date(dateStr).getTime(); if(isNaN(t)) return 999; return Math.max(0,Math.round((new Date(2026,5,23).getTime()-t)/86400000)); }\n  adverseEvents(c){\n    const pool=[\n      {type:\"CCJ\",label:\"County Court Judgment registered\",sev:\"high\"},\n      {type:\"downgrade\",label:\"Creditsafe rating downgraded\",sev:\"high\"},\n      {type:\"litigation\",label:\"Commercial litigation filed\",sev:\"high\"},\n      {type:\"late\",label:\"Accounts filed late\",sev:\"med\"},\n      {type:\"redundancy\",label:\"Redundancy programme announced\",sev:\"med\"},\n      {type:\"director\",label:\"Board director resignation\",sev:\"low\"},\n      {type:\"press\",label:\"Adverse press coverage\",sev:\"low\"}\n    ];\n    const seed=(c._idx*7+c.id*3);\n    const n=(c.credit!=null && c.credit<80) ? 2 : (seed%3===0 ? 1 : 0);\n    const out=[];\n    for(let k=0;k<n;k++){ const e=pool[(seed+k*3)%pool.length]; out.push({label:e.label, sev:e.sev, source: e.type===\"press\"||e.type===\"redundancy\"?\"Cognism\":\"Creditsafe\", date:this.daysAgo(12+((seed+k*17)%160)) }); }\n    return out;\n  }\n  adversePenalty(c){ return this.adverseEvents(c).reduce((a,e)=>a+(e.sev===\"high\"?12:e.sev===\"med\"?6:3),0); }\n  talentScore(c){ const t=this.talentVals(c); const v=60 + (t.headcountChange||0)*1.6 - ((t.attrition||12)-12)*2.2 + ((t.tenure||5)-4)*5; return Math.max(0,Math.min(100,Math.round(v))); }\n  healthScore(c){\n    const q=this.clientScoreVals(c); const qualAvg=(q.relationship+q.delivery+q.growth+q.payment+q.strategic)/5; const qual100=qualAvg/5*100;\n    const talent100=this.talentScore(c);\n    const w=this.state.healthWeights; const base=(qual100*w.qual + talent100*w.talent)/Math.max(1,(w.qual+w.talent));\n    const health=base - this.adversePenalty(c)*(w.adverse/100);\n    return Math.max(0,Math.min(100,Math.round(health)));\n  }\n  healthBand(v){ if(v>=75) return {label:\"Healthy\",bg:\"var(--good-tint)\",fg:\"var(--good)\"}; if(v>=55) return {label:\"Watch\",bg:\"rgba(224,169,63,0.18)\",fg:\"var(--warn)\"}; return {label:\"At risk\",bg:\"var(--danger-tint)\",fg:\"var(--danger)\"}; }\n  setRating(cid,dim,val){ this.setState(st=>({clientScores:{...st.clientScores,[cid]:{...(st.clientScores[cid]||{}),[dim]:val}}})); }\n  setTalent(cid,field,val){ this.setState(st=>({talent:{...st.talent,[cid]:{...(st.talent[cid]||{}),[field]:val}}})); }\n  markReviewed(cid){ this.setState(st=>({clientReviewed:{...st.clientReviewed,[cid]:this.daysAgo(0)}})); this.toastMsg(\"Marked as reviewed today\"); }\n\n  // ---- email quality (Cognism grade) + notifications ----\n  gradeMeta(g){ const m={A:[\"High\",\"var(--good-tint)\",\"var(--good)\"],B:[\"Good\",\"var(--navy-tint)\",\"var(--navy)\"],C:[\"Mid\",\"rgba(224,169,63,0.18)\",\"var(--warn)\"],D:[\"Low\",\"var(--danger-tint)\",\"var(--danger)\"]}; return m[g]||m.C; }\n  sourceMeta(src){ const m={\"Cognism\":[\"var(--brand-tint)\",\"var(--brand-deep)\"],\"Syntax-Match\":[\"var(--navy-tint)\",\"var(--navy)\"],\"Apollo\":[\"var(--cool-tint)\",\"var(--cool)\"]}; return m[src]||[\"var(--surface-2)\",\"var(--muted)\"]; }\n  midOrLowEmail(g){ return g===\"C\"||g===\"D\"; }\n  notifMeta(type){ const m={failed:[\"Failure\",\"var(--danger-tint)\",\"var(--danger)\"],nomatch:[\"No match\",\"var(--danger-tint)\",\"var(--danger)\"],lowconf:[\"Low confidence\",\"rgba(224,169,63,0.18)\",\"var(--warn)\"],email:[\"Email quality\",\"var(--cool-tint)\",\"var(--cool)\"]}; return m[type]||m.lowconf; }\n  buildNotifications(){\n    const s=this.state; const out=[];\n    s.companies.filter(c=>c.status===\"failed\").forEach(c=>out.push({id:\"nf-\"+c.id,type:\"failed\",title:\"Enrichment failed\",detail:c.name+\" \\u2014 \"+(c.reason||\"No matching company record found\"),cta:\"Retry in queue\",go:()=>this.setState({screen:\"import\"}),time:c.enrichedAt||\"just now\"}));\n    s.companies.filter(c=>c.status===\"scored\").forEach(c=>{\n      const sc=this.companyScore(c);\n      if(sc&&sc.flag) out.push({id:\"nm-\"+c.id,type:\"nomatch\",title:\"No ICP match\",detail:c.name+\" \\u2014 \"+((sc.fit&&sc.fit.reasons&&sc.fit.reasons.length)?sc.fit.reasons.join(\" \\u00b7 \"):\"fails a hard ICP rule\"),cta:c.approved===false?\"Review in triage\":\"Open account\",go:c.approved===false?(()=>this.setState({screen:\"triage\"})):(()=>this.setState({screen:\"detail\",detailId:c.id,dMode:\"scorecard\"})),time:c.lastScored||\"\"});\n      if(!c.sector) out.push({id:\"ns-\"+c.id,type:\"nomatch\",title:\"No sector match\",detail:c.name+\" \\u2014 web research returned no confident sector\",cta:\"Classify in triage\",go:()=>this.setState({screen:\"triage\"}),time:c.lastScored||\"\"});\n      if(c.conf!=null&&c.conf<70) out.push({id:\"lc-\"+c.id,type:\"lowconf\",title:\"Low data confidence\",detail:c.name+\" \\u2014 scored at \"+c.conf+\"% data confidence\",cta:\"Open account\",go:()=>this.setState({screen:\"detail\",detailId:c.id,dMode:\"scorecard\"}),time:c.lastScored||\"\"});\n    });\n    s.companies.filter(c=>c.status===\"scored\"&&c.approved!==false).forEach(c=>{\n      const cs=this.contactsFor(c).filter(p=>this.isRedeemed(p.id)&&this.midOrLowEmail(p.emailGrade));\n      if(cs.length) out.push({id:\"eq-\"+c.id,type:\"email\",title:\"Mid / low email quality\",detail:cs.length+\" contact\"+(cs.length>1?\"s\":\"\")+\" at \"+c.name+\" returned a grade C/D email after a bulk pull\",cta:\"Open contacts\",go:()=>this.setState({screen:\"contacts\",emailFilter:\"midlow\"}),time:this.pulledDate(cs[0].id)||\"\"});\n    });\n    return out;\n  }\n\n  componentDidMount(){\n    // pre-redeem a couple of contacts so both redeemed/not-redeemed states are visible on load\n    const seedRedeem={};\n    const scored=this.state.companies.filter(c=>c.status===\"scored\"&&c.approved!==false);\n    const first=scored[0];\n    let seededContactLog=[];\n    if(first){ const cs=this.contactsFor(first); if(cs[0]) seedRedeem[cs[0].id]=this.daysAgo(2); if(cs[1]) seedRedeem[cs[1].id]=this.daysAgo(2);\n      seededContactLog=[{ id:\"uc-seed\", date:this.daysAgo(2), company t ra={...st.redeemedAt}; fresh.forEach(id=>ra[id]=today);\n      const sel={...st.contactSel}; fresh.forEach(id=>delete sel[id]);\n      return { redeemedAt:ra, contactSel:sel, usageContacts:[...logEntries, ...st.usageContacts] };\n    });\n    this.toastMsg(fresh.length+\" \"+(fresh.length===1?\"contact\":\"contacts\")+\" enriched — email & phone revealed\");\n  }\n  // build company-grouped contact records; optional single-company filter; sorted by score or tier\n  contactGroups(filterCompanyId){\n    const s=this.state;\n    let comps=s.companies.filter(c=>c.status===\"scored\"&&c.approved!==false);\n    if(filterCompanyId!=null) comps=comps.filter(c=>c.id===filterCompanyId);\n    const groups=comps.map(c=>{\n      const sc=this.companyScore(c);\n      return { company:c, score:sc?sc.total:0, tier:sc?sc.tier:null, flag:sc?sc.flag:false, contacts:this.contactsFor(c), emailLow:this.contactsFor(c).filter(p=>this.midOrLowEmail(p.emailGrade)).length };\n    });\n    if(filterCompanyId==null){\n      const dir=-1;\n      if(s.contactSort===\"tier\") groups.sort((a,b)=>{const o={A:1,B:2,C:3};return (o[a.tier]||9)-(o[b.tier]||9) || b.score-a.score;});\n      else if(s.contactSort===\"name\") groups.sort((a,b)=>a.company.name.localeCompare(b.company.name));\n      else if(s.contactSort===\"email\") groups.sort((a,b)=>b.emailLow-a.emailLow || b.score-a.score);\n      else groups.sort((a,b)=>(b.score-a.score)*1);\n    }\n    return groups;\n  }\n\n  // ---- nav / actions ----\n  navStyle(active,shell){\n    const base=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 11px;border:none;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;\";\n    return base + (active\n      ? \"background:var(--brand);color:#fff;\"\n      : \"background:transparent;color:var(--shell-ink-2);\");\n  }\n  segBtn(active){\n    return \"border:none;border-radius:7px;padding:6px 15px;font-size:12.5px;font-weight:600;cursor:pointer;f    {label:\"Active users\",value: uf===\"all\"?activeUsers:1,active:false}\n      ].map(x=>({label:x.label, value:x.value.toLocaleString(\"en-GB\"),\n        cardStyle:\"background:var(--surface);border:1px solid \"+(x.active?\"var(--brand)\":\"var(--line)\")+\";border-radius:14px;padding:16px 18px;\",\n        valueStyle:\"font-family:'Archivo';font-weight:700;font-size:27px;letter-spacing:-0.02em;color:\"+(x.active?\"var(--brand-deep)\":\"var(--ink)\")+\";\"}));\n\n      // by sector\n      const secTotals={};\n      wk.forEach(w=>usersShown.forEach(u=>{ const secs=(w.perUser[u.id]||{}).sectors||{}; Object.keys(secs).forEach(sec=>secTotals[sec]=(secTotals[sec]||0)+secs[sec]); }));\n      const secMax=Math.max(1,...Object.values(secTotals));\n      vals.anSectors=Object.keys(secTotals).sort((a,b)=>secTotals[b]-secTotals[a]).map(sec=>({name:sec, value:secTotals[sec].toLocaleString(\"en-GB\"),\n        dotStyle:\"width:9px;height:9px;border-radius:2px;flex:none;background:\"+this.sectorColor(sec)+\";\",\n        barStyle:\"display:block;height:100%;border-radius:5px;width:\"+Math.round(secTotals[sec]/secMax*100)+\"%;background:\"+this.sectorColor(sec)+\";\"}));\n\n      // per-user leaderboard\n      vals.anLeaders=this.team.map(u=>{\n        const c=wk.reduce((a,w)=>a+((w.perUser[u.id]||{}).companies||0),0);\n        const p=wk.reduce((a,w)=>a+((w.perUser[u.id]||{}).contacts||0),0);\n        const k=wk.reduce((a,w)=>a+((w.perUser[u.id]||{}).csvs||0),0);\n        return {u,c,p,k};\n      }).sort((a,b)=>b.c-a.c).map((r,i)=>({\n        rank:i+1, name:r.u.name, role:r.u.role, initials:r.u.initials,\n        avatarStyle:\"width:34px;height:34px;flex:none;border-radius:50%;background:\"+r.u.color+\";color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:700;font-size:12px;\",\n        csvs:r.k.toLocaleString(\"en-GB\"), companies:r.c.toLocaleString(\"en-GB\"), contacts:r.p.toLocaleString(\"en-GB\"),\n        isMe:r.u.id===s.aut    {label:\"Low confidence\",value:cLow,tone:cLow?\"var(--warn)\":\"var(--muted)\"},\n        {label:\"Email quality\",value:cEmail,tone:cEmail?\"var(--cool)\":\"var(--muted)\"}\n      ].map(x=>({label:x.label,value:x.value,valueStyle:\"font-family:'Archivo';font-weight:700;font-size:22px;letter-spacing:-0.02em;color:\"+x.tone+\";\"}));\n      vals.goAllNotifs=vals.goNotifications;\n\n      // triage callout\n      vals.homeTriagePending=triagePending;\n      vals.hasHomeTriage=triagePending>0;\n      vals.homeTriageLine=triagePending+\" account\"+(triagePending===1?\"\":\"s\")+\" scored and awaiting approval\";\n\n      // last run one-liner\n      const lr=s.usageRuns[0];\n      vals.hasLastRun=!!lr;\n      if(lr){\n        const scoredN=lr.companies.filter(c=>c.status===\"scored\").length;\n        const failN=lr.companies.filter(c=>c.status===\"failed\").length;\n        vals.lastRunTitle=\"Last run — ICP \"+lr.icp;\n        vals.lastRunLine=lr.companies.length+\" companies · \"+scoredN+\" scored\"+(failN?\" · \"+failN+\" failed\":\"\")+\" · \"+lr.date;\n        vals.lastRunBy=\"Run by \"+lr.runBy;\n        vals.lastRunGo=()=>this.setState({screen:\"usage\"});\n      }\n\n      // where to push — thin / weak ICPs and sectors\n      const icpStats=this.ICPS.map(p=>{ const set=scored.filter(c=>(c.icp||\"\")===p.id); const scs=set.map(c=>this.companyScore(c)).filter(Boolean); const cnt=set.length; const avg=cnt?Math.round(scs.reduce((a,x)=>a+x.total,0)/cnt):0; return {id:p.id,name:p.name,cnt,avg}; });\n      const seedCfg=()=>({dWeights:{...s.weights},dThr:{...s.thr},dIcpWeights:JSON.parse(JSON.stringify(s.icpWeights)),dRuleHard:JSON.parse(JSON.stringify(s.ruleHard))});\n      const recs=[];\n      icpStats.forEach(st=>{\n        if(st.cnt===0) recs.push({priority:1,tag:\"Empty\",tone:\"var(--danger)\",title:\"ICP \"+st.id+\" — \"+st.name,detail:\"No accounts yet. Run an import against this profile.\",cta:\"Add to ICP \"+st.id,go:()=>this.setState({screen:\"import\",batchIcp:st.id})});\n        else if(st.cnt<4) recs.push({priority:2,tag:\"Thin\",tone:\"var(--warn)\",title:\"ICP \"+st.id+\" — \"+st.name,detail:\"Only \"+st.cnt+\" account\"+(st.cnt===1?\"\":\"s\")+\". Import more to build coverage.\",cta:\"Add to ICP \"+st.id,go:()=>this.setState({screen:\"import\",batchIcp:st.id})});\n        else if(st.avg<78) recs.push({priority:3,tag:\"Low avg\",tone:\"var(--warn)\",title:\"ICP \"+st.id+\" — \"+st.name,detail:\"Averaging \"+st.avg+\"/100. Tighten the model or refresh the data.\",cta:\"Tune model\",go:()=>this.setState(Object.assign({screen:\"config\",cfgIcp:st.id},seedCfg()))});\n      });\n      const secCounts={}; scored.forEach(c=>{ if(c.sector) secCounts[c.sector]=(secCounts[c.sector]||0)+1; });\n      Object.keys(secCounts).sort((a,b)=>secCounts[a]-secCounts[b]).forEach(sec=>{ if(secCounts[sec]<2) recs.push({priority:4,tag:\"Sector gap\",tone:\"var(--cool)\",title:sec,detail:\"Only \"+secCounts[sec]+\" account in this sector. Consider broadening coverage.\",cta:\"View sector\",go:()=>this.setState({screen:\"overview\",listIcp:\"all\",sectorFilter:sec})}); });\n      recs.sort((a,b)=>a.priority-b.priority);\n      vals.pushRecs=recs.slice(0,4).map(r=>({title:r.title,detail:r.detail,cta:r.cta,go:r.go,tag:r.tag,tagStyle:\"font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:0.04em;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:\"+r.tone+\";\",barStyle:\"width:4px;align-self:stretch;border-radius:3px;flex:none;background:\"+r.tone+\";\"}));\n      vals.hasPush=recs.length>0;\n      vals.pushEmpty=recs.length===0;\n\n      // one primary action\n      let primary;\n      if(cFailed>0) primary={label:\"Retry \"+cFailed+\" failed enrichment\"+(cFailed>1?\"s\":\"\"),go:()=>this.setState({screen:\"import\"})};\n      else if(triagePending>0) primary={label:\"Review \"+triagePending+\" account\"+(triagePending>1?\"s\":\"\")+\" in triage\",go:()=>this.setState({screen:\"triage\"})};\n      else if(cNo>0) primary={label:\"Resolve \"+cNo+\" no-match flag\"+(cNo>1?\"s\":\"\"),go:vals.goNotifications};\n      else if(recs.length) primary={label:recs[0].cta,go:recs[0].go};\n      else primary={label:\"Add companies\",go:()=>this.setState({screen:\"import\"})};\n      vals.primaryLabel=primary.label; vals.primaryGo=primary.go;\n      vals.homeSummary = notifs.length\n        ? (notifs.length+\" item\"+(notifs.length===1?\"\":\"s\")+\" need attention\"+(triagePending?\", \"+triagePending+\" awaiting triage\":\"\")+\".\")\n        : (triagePending?(triagePending+\" account\"+(triagePending===1?\"\":\"s\")+\" awaiting triage.\"):\"Everything looks healthy — no open flags.\");\n    }\n\n    // ---------- NOTIFICATIONS ----------\n    if(s.screen===\"notifications\"){\n      const countBy=(t)=>notifs.filter(n=>n.type===t).length;\n      let shown=notifs;\n      if(s.notifFilter!==\"all\") shown=notifs.filter(n=>n.type===s.notifFilter);\n      vals.notifFilters=[\n        {label:\"All\",v:\"all\",count:notifs.length},\n        {label:\"Failures\",v:\"failed\",count:countBy(\"failed\")},\n        {label:\"No match\",v:\"nomatch\",count:countBy(\"nomatch\")},\n        {label:\"Low confidence\",v:\"lowconf\",count:countBy(\"lowconf\")},\n        {label:\"Email quality\",v:\"email\",count:countBy(\"email\")}\n      ].map(o=>({label:o.label,count:o.count,style:this.chipBtn(s.notifFilter===o.v),onClick:()=>this.setState({notifFilter:o.v})}));\n      vals.notifItems=shown.map(n=>{ const m=this.notifMeta(n.type); return {\n        title:n.title, detail:n.detail, cta:n.cta, go:n.go, time:n.time||\"\",\n        typeLabel:m[0],\n        typeStyle:\"font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.04em;padding:3px 8px;border-radius:5px;background:\"+m[1]+\";color:\"+m[2]+\";\",\n        barStyle:\"width:4px;align-self:stretch;border-radius:3px;flex:none;background:\"+m[2]+\";\",\n        dotStyle:\"width:34px;height:34px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:\"+m[1]+\";color:\"+m[2]+\";\"\n      };});\n      vals.notifEmpty=shown.length===0;\n      vals.notifTotalLabel=notifs.length+\" open\";\n      vals.notifEmptyHint = s.notifFilter!==\"all\" ? \"No items in this category right now.\" : \"Nothing needs attention. Failures, weak matches and email-quality alerts will show here.\";\n    }\n\n    // ---------- IMPORT & QUEUE ----------\n    vals.csvNoFile=!s.csvLoaded; vals.csvHasFile=s.csvLoaded;\n    vals.loadSampleCsv=()=>this.setState({csvLoaded:true});\n    vals.clearCsv=()=>this.setState({csvLoaded:false});\n    const sampleCsv=[\n      {name:\"Forterra Building Products\",domain:\"forterra.co.uk\",valid:true},\n      {name:\"Aggregate Industries UK\",domain:\"aggregate.com\",valid:true},\n      {name:\"Breedon Group plc\",domain:\"breedongroup.com\",valid:true},\n      {name:\"Wienerberger Ltd\",domain:\"wienerberger.co.uk\",valid:true},\n      {name:\"Premier Modular\",domain:\"\",valid:false,reason:\"missing domain\"},\n      {name:\"Steelwork Solutions\",domain:\"steelworksolutions.co.uk\",valid:true}\n    ];\n    if(s.csvLoaded){\n      const valid=sampleCsv.filter(r=>r.valid).length;\n      vals.csvValidCount=valid; vals.csvInvalidCount=sampleCsv.length-valid; vals.csvTotalCount=sampleCsv.length;\n      vals.csvRows=sampleCsv.map((r,i)=>({\n        name:r.name, domain:r.domain||\"—\",\n        style:\"display:grid;grid-template-columns:14px minmax(0,1.4fr) 1fr auto;gap:12px;align-items:center;padding:11px 14px;\"+(i>0?\"border-top:1px solid var(--line-2);\":\"\"),\n        dotStyle:`width:8px;height:8px;border-radius:50%;flex:none;background:${r.valid?\"var(--good)\":\"var(--danger)\"};`,\n        tag: r.valid?\"valid\":(r.reason||\"invalid\"),\n        tagStyle:`font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;background:${r.valid?\"var(--good-tint)\":\"var(--danger-tint)\"};color:${r.valid?\"var(--good)\":\"var(--danger)\"};`\n      }));\n    } else { vals.csvValidCount=0; vals.csvInvalidCount=0; vals.csvRows=[]; }\n\n    vals.manualName=s.manualName; vals.manualDomain=s.manualDomain;\n    vals.onManualName=(e)=>this.setState({manualName:e.target.value});\n    vals.onManualDomain=(e)=>this.setState({manualDomain:e.target.value});\n    vals.addManualRow=()=>{ if(!s.manualDomain.trim())return this.toastMsg(\"Domain is required\"); this.setState(st=>({staged:[...st.staged,{name:st.manualName||st.manualDomain,domain:st.manualDomain}],manualName:\"\",manualDomain:\"\"})); };\n    vals.hasStaged=s.staged.length>0;\n    vals.stagedCount=s.staged.length;\n    vals.stagedRows=s.staged.map((r,i)=>({name:r.name,domain:r.domain,remove:()=>this.setState(st=>({staged:st.staged.filter((_,k)=>k!==i)}))}));\n    vals.submitCsv=()=>{ const toAdd=sampleCsv.map(r=>({name:r.name,domain:r.domain})); this.queueCompanies(toAdd); this.setState({csvLoaded:false}); };\n    vals.submitStaged=()=>{ if(!s.staged.length)return; this.queueCompanies(s.staged.slice()); this.setState({staged:[]}); };\n\n    // ===== review & run =====\n    const queued=s.companies.filter(c=>c.status===\"queued\");\n    const invalidQueued=queued.filter(c=>!this.domainValid(c.domain));            // need attention (bad domain)\n    const domainOK=queued.filter(c=>this.domainValid(c.domain));\n    const insufficientQueued=domainOK.filter(c=>!this.presenceCheck(c).pass);     // skipped: insufficient data\n    const eligibleQueued=domainOK.filter(c=>this.presenceCheck(c).pass);          // ready to pull\n    vals.queuedTotal=queued.length;\n    vals.readyCount=eligibleQueued.length;\n    vals.skippedCount=insufficientQueued.length;\n    vals.attentionCount=invalidQueued.length;\n    vals.readyStatStyle=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:3px 10px;border-radius:7px;background:var(--good-tint);color:var(--good);\";\n    vals.skippedStatStyle=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:3px 10px;border-radius:7px;background:\"+(insufficientQueued.length?\"var(--cool-tint)\":\"var(--surface-2)\")+\";color:\"+(insufficientQueued.length?\"var(--cool)\":\"var(--muted)\")+\";\";\n    vals.attentionStatStyle=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:3px 10px;border-radius:7px;background:\"+(invalidQueued.length?\"var(--danger-tint)\":\"var(--surface-2)\")+\";color:\"+(invalidQueued.length?\"var(--danger)\":\"var(--muted)\")+\";\";\n    vals.hasInvalid=invalidQueued.length>0;\n    vals.invalidRows=invalidQueued.map(c=>({\n      name:c.name,\n      domain:c.domain||\"\",\n      reason: !c.domain||!c.domain.trim() ? \"No domain provided\" : \"Domain looks malformed\",\n      onDomain:(e)=>this.patch(c.id,{domain:e.target.value}),\n      remove:()=>this.setState(st=>({companies:st.companies.filter(x=>x.id!==c.id)}))\n    }));\n    // skipped (insufficient data) — listed with reason\n    vals.hasSkipped=insufficientQueued.length>0;\n    vals.skippedRows=insufficientQueued.map(c=>({\n      name:c.name,\n      domain:c.domain,\n      reason:this.presenceCheck(c).reason,\n      remove:()=>this.setState(st=>({companies:st.companies.filter(x=>x.id!==c.id)}))\n    }));\n\n    // pre-run summary\n    const priceNum=parseFloat(s.csPrice);\n    const priceSet=!isNaN(priceNum)&&priceNum>0;\n    const pulls=eligibleQueued.filter(c=>!this.withinPullWindow(c)).length;\n    const freshSkipped=eligibleQueued.length-pulls;\n    const cognismCredits=eligibleQueued.length; // worst case one account-enrichment per company\n    const totalCredits=pulls+cognismCredits;\n    vals.toProcess=eligibleQueued.length;\n    vals.companiesLine=eligibleQueued.length+\" \"+(eligibleQueued.length===1?\"company\":\"companies\")+\" to process\"+(insufficientQueued.length?\" (\"+insufficientQueued.length+\" skipped, insufficient data)\":\"\")+\".\";\n    vals.creditsafeLine=pulls+\" Creditsafe \"+(pulls===1?\"report\":\"reports\")+\" to pull\"+(freshSkipped>0?\" (\"+freshSkipped+\" already up to date)\":\"\")+\".\";\n    vals.cognismLine=cognismCredits+\" Cognism \"+(cognismCredits===1?\"credit\":\"credits\")+\" — worst case, one company enrichment each.\";\n    vals.noContactsLine=\"Buyer contacts are not pulled in this run — they spend Cognism contact credits separately, on demand.\";\n    // ICP selector for the batch\n    const icpSet=!!s.batchIcp;\n    vals.icpChosen=icpSet;\n    vals.icpOptions=this.ICPS.map(p=>{\n      const sel=s.batchIcp===p.id;\n      return {\n        id:p.id, letter:p.id, name:p.name, short:p.short,\n        onClick:()=>this.setState({batchIcp:p.id}),\n        cardStyle:\"text-align:left;border:1.5px solid \"+(sel?\"var(--brand)\":\"var(--line)\")+\";border-radius:13px;padding:13px 15px;background:\"+(sel?\"var(--brand-tint)\":\"var(--surface-2)\")+\";cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s;\",\n        badgeStyle:\"width:30px;height:30px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:800;font-size:15px;background:\"+(sel?\"var(--brand)\":\"var(--surface-3)\")+\";color:\"+(sel?\"#fff\":\"var(--ink-2)\")+\";\",\n        selected:sel\n      };\n    });\n    vals.icpHintStyle=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:3px 10px;border-radius:7px;background:\"+(icpSet?\"var(--good-tint)\":\"var(--brand-tint)\")+\";color:\"+(icpSet?\"var(--good)\":\"var(--brand-deep)\")+\";\";\n    vals.icpHintLabel= icpSet ? (\"ICP \"+s.batchIcp+\" selected\") : \"Required\";\n    vals.icpName= icpSet ? this.ICPS.find(p=>p.id===s.batchIcp).name : \"\";\n\n    vals.priceSet=priceSet;\n    vals.costLine= priceSet ? (\"Indicative cost: \"+this.poundFmt(totalCredits*priceNum)+\" (\"+totalCredits+\" credits @ \"+this.poundFmt(priceNum)+\")\") : \"\";\n    vals.runDisabled = s.batchRunning || eligibleQueued.length===0 || !icpSet;\n    vals.runLabel = s.batchRunning ? \"Running\\u2026\" : \"Run enrichment\";\n    vals.runBlockedReason = !icpSet ? \"Choose an ICP to enable the run\" : (eligibleQueued.length===0 ? \"No companies have enough data to pull yet\" : \"\");\n    vals.runBtnStyle=\"display:flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 24px;border:none;border-radius:11px;font-size:14.5px;font-weight:700;font-family:inherit;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.14);cursor:\"+(vals.runDisabled?\"not-allowed\":\"pointer\")+\";background:\"+(vals.runDisabled?\"var(--muted)\":\"var(--brand)\")+\";opacity:\"+(vals.runDisabled?\"0.6\":\"1\")+\";\";\n    vals.onRun=()=>this.runBatch();\n    vals.batchRunning=s.batchRunning;\n    vals.runReady=!s.batchRunning;\n    vals.hasRunBlock=!!vals.runBlockedReason && !s.batchRunning;\n\n    // progress (over the most recent run batch)\n    const bIds=s.batchIds;\n    const bCompanies=bIds.map(id=>s.companies.find(c=>c.id===id)).filter(Boolean);\n    const bScored=bCompanies.filter(c=>c.status===\"scored\").length;\n    const bFailed=bCompanies.filter(c=>c.status===\"failed\").length;\n    const bProcessed=bScored+bFailed;\n    vals.showProgress=bIds.length>0;\n    vals.progressPct = bIds.length? Math.round(bProcessed/bIds.length*100):0;\n    vals.progressBarStyle=\"display:block;height:100%;border-radius:99px;width:\"+vals.progressPct+\"%;background:var(--brand);transition:width .4s ease;\";\n    vals.progressLabel = bScored+\" of \"+bIds.length+\" scored\"+(bFailed?\" \\u00b7 \"+bFailed+\" failed\":\"\");\n    vals.progressSub = s.batchRunning ? \"Working through the batch a few at a time to stay within limits\\u2026\" : (bIds.length? \"Run finished.\":\"\" );\n\n    // queue rows\n    const stepDefs={\n      queued:   [\"todo\",\"todo\",\"todo\",\"todo\",\"todo\"],\n      enriching:[\"done\",\"active\",\"active\",\"todo\",\"todo\"],\n      failed:   [\"done\",\"fail\",\"todo\",\"todo\",\"todo\"]\n    };\n    const stepLabels=[\"Resolve\",\"Report\",\"Enrich\",\"Classify\",\"Score\"];\n    const stColor={done:\"var(--good)\",active:\"var(--brand)\",todo:\"var(--line)\",fail:\"var(--danger)\"};\n    const active=s.companies.filter(c=>c.status===\"enriching\"||c.status===\"queued\"||c.status===\"failed\");\n    const stMap2={enriching:[\"var(--brand-tint)\",\"var(--brand-deep)\",\"Enriching\",true],queued:[\"var(--cool-tint)\",\"var(--cool)\",\"Queued\",false],failed:[\"var(--danger-tint)\",\"var(--danger)\",\"Failed\",false]};\n    vals.queueRows=active.map(c=>{\n      const states=stepDefs[c.status]||stepDefs.queued;\n      const sm=stMap2[c.status];\n      const invalid=c.status===\"queued\"&&!this.domainValid(c.domain);\n      return {\n        id:c.id, name:c.name, domain:c.domain||\"\\u2014\", initials:this.initialsOf(c.name),\n        markStyle:\"width:34px;height:34px;flex:none;border-radius:9px;background:var(--surface-3);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'Archivo';\",\n        statusLabel: invalid?\"Needs domain\":sm[2], spin:sm[3],\n        statusStyle:`display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:${invalid?\"var(--danger-tint)\":sm[0]};color:${invalid?\"var(--danger)\":sm[1]};`,\n        isFailed:c.status===\"failed\",\n        reason: c.status===\"failed\" ? (c.reason||\"No matching company record found\") : \"\",\n        retry:()=>{ this.patch(c.id,{status:\"queued\",_fail:false,reason:null}); this.processRow(c.id); this.toastMsg(\"Retrying \"+c.name); },\n        steps: states.map((stt,i)=>({\n          label:stepLabels[i],\n          glyph: stt===\"done\"?\"\\u2713\":stt===\"fail\"?\"\\u2715\":\"\",\n          dotStyle:`width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none;${stt===\"active\"?\"animation:lgpulse 1.3s ease-in-out infinite;\":\"\"}background:${stt===\"todo\"?\"var(--surface-3)\":stColor[stt]};${stt===\"todo\"?\"color:var(--muted);border:1px solid var(--line);\":\"\"}`,\n          lineStyle: i<4 ? `flex:1;height:2px;min-width:10px;background:${(stt===\"done\")?\"var(--good)\":\"var(--line)\"};` : \"display:none;\"\n        }))\n      };\n    });\n    const eC=active.filter(c=>c.status===\"enriching\").length, qC=active.filter(c=>c.status===\"queued\").length, fC=active.filter(c=>c.status===\"failed\").length;\n    vals.queueSummary = active.length ? (qC+\" queued \\u00b7 \"+eC+\" enriching \\u00b7 \"+fC+\" failed \\u00b7 \"+scored.length+\" scored\") : (scored.length+\" accounts scored\");\n    vals.hasFailed=fC>0;\n    vals.retryAllFailed=()=>{ const fIds=s.companies.filter(c=>c.status===\"failed\").map(c=>c.id); fIds.forEach(id=>this.patch(id,{status:\"queued\",_fail:false,reason:null})); this.toastMsg(fIds.length+\" moved back to the queue — run again to retry\"); };\n    vals.runStatusLabel = s.batchRunning ? \"Run in progress\" : \"Idle — nothing running\";\n    vals.runStatusColor = s.batchRunning ? \"var(--good)\" : \"var(--muted)\";\n    vals.runStatusPulse = s.batchRunning ? \"animation:lgpulse 1.3s ease-in-out infinite;\" : \"\";\n    vals.hasQueue=active.length>0;\n    vals.queueEmpty=active.length===0;\n\n    return vals;\n  }\n\n  queueCompanies(toAdd){\n    if(!toAdd||!toAdd.length)return;\n    const base=this.state.companies.length;\n    const newCompanies=toAdd.map((r,i)=>{ const cid=this._nextId++; return {id:cid,name:r.name,domain:r.domain,no:null,industry:\"Awaiting enrichment\",seg:null,country:\"UK\",founded:null,head:null,sites:null,rev:null,cur:\"\\u00a3\",credit:null,risk:null,own:null,legal:null,parent:null,hq:null,status:\"queued\",conf:null,sub:null,_idx:base+i,_contacts:null,lastScored:null}; });\n    this.setState(st=>({companies:[...newCompanies,...st.companies]}));\n    const bad=toAdd.filter(r=>!this.domainValid(r.domain)).length;\n    this.toastMsg(toAdd.length+\" added to the queue\"+(bad?\" \\u00b7 \"+bad+\" need a valid domain\":\"\"));\n  }\n\n  // template-ready grouped contacts (used by Contacts screen + company detail)\n  groupVals(groups, emailFilter){\n    const ff = emailFilter && emailFilter!==\"all\" ? emailFilter : null;\n    return groups.map(g=>{\n      let display=g.contacts;\n      if(ff) display=g.contacts.filter(p=> this.isRedeemed(p.id) && (ff===\"midlow\" ? this.midOrLowEmail(p.emailGrade) : p.emailGrade===ff));\n      if(ff && display.length===0) return null;\n      const ids=g.contacts.map(p=>p.id);\n      const tc=this.tierColors(g.tier);\n      const unredeemed=ids.filter(id=>!this.isRedeemed(id));\n      const redeemedCount=ids.length-unredeemed.length;\n      return {\n        companyId:g.company.id, name:g.company.name, domain:g.company.domain, initials:this.initialsOf(g.company.name),\n        sector:g.company.sector||\"\", hasSector:!!g.company.sector,\n        sectorStyle:`display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:${this.sectorTint(g.company.sector)};color:${this.sectorColor(g.company.sector)};white-space:nowrap;`,\n        score:g.score, tier:g.tier, icp:g.company.icp||\"\",\n        tierStyle:`display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;border-radius:6px;font-family:'Archivo';font-weight:700;font-size:12px;background:${tc.bg};color:${tc.fg};`,\n        icpBadgeStyle:\"display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;font-size:11px;font-weight:600;background:var(--navy-tint);color:var(--navy);\",\n        flag:g.flag,\n        count:ids.length, redeemedCount,\n        countLabel: redeemedCount+\" of \"+ids.length+\" enriched\",\n        open:()=>this.setState({screen:\"detail\",detailId:g.company.id,dMode:\"scorecard\"}),\n        contacts:display.map(p=>this.mapContactRow(p)),\n        midLowCount: g.contacts.filter(p=>this.midOrLowEmail(p.emailGrade)).length,\n        hasUnredeemed: unredeemed.length>0,\n        selectGroup:()=>this.setState(st=>{ const sel={...st.contactSel}; const anyUnsel=unredeemed.some(id=>!sel[id]); unredeemed.forEach(id=>{ if(anyUnsel) sel[id]=true; else delete sel[id]; }); return {contactSel:sel}; }),\n        enrichGroup:()=>this.enrichContacts(unredeemed.length?unredeemed:ids)\n      };\n    }).filter(Boolean);\n  }\n\n  // map a contact record to template-ready row (per-contact redeemed state + selection)\n  mapContactRow(p){\n    const redeemed=this.isRedeemed(p.id);\n    const sel=!!this.state.contactSel[p.id];\n    return {\n      id:p.id, name:p.name, title:p.title, seniority:p.seniority, initials:this.initialsOf(p.name),\n      quality:p.quality, linkedin:p.linkedin,\n      redeemed, notRedeemed:!redeemed,\n      email: redeemed ? p.email : \"•••••• @ \"+(p.email.split(\"@\")[1]||\"\"),\n      phone: redeemed ? p.phone : \"••• ••• ••••\",\n      direct: redeemed ? p.direct : \"••• ••• ••••\",\n      mobile: redeemed ? p.mobile : \"••• ••• ••••\",\n      tenureRole:p.tenureRole, tenureCo:p.tenureCo,\n      pulled: redeemed ? this.pulledDate(p.id) : \"\",\n      selected:sel,\n      qualityStyle:this.qualityStyle(p.quality),\n      emailGrade:p.emailGrade, gradeLabel:this.gradeMeta(p.emailGrade)[0], midLow:this.midOrLowEmail(p.emailGrade),\n      gradeStyle:\"display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:18px;padding:0 5px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;background:\"+this.gradeMeta(p.emailGrade)[1]+\";color:\"+this.gradeMeta(p.emailGrade)[2]+\";\",\n      source:p.source, sourceStyle:\"display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.03em;background:\"+this.sourceMeta(p.source)[0]+\";color:\"+this.sourceMeta(p.source)[1]+\";\",\n      seniorityStyle:\"font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:0.04em;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;\",\n      copyBtnStyle:this.copyBtn(),\n      toggleSel:()=>this.setState(st=>({contactSel:{...st.contactSel,[p.id]:!st.contactSel[p.id]}})),\n      enrich:()=>this.enrichContacts([p.id]),\n      copyEmail:()=>this.copy(p.email,\"Email\"),\n      copyDirect:()=>this.copy(p.direct,\"Direct line\"),\n      copyMobile:()=>this.copy(p.mobile,\"Mobile\"),\n      copyPhone:()=>this.copy(p.phone,\"Number\")\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
